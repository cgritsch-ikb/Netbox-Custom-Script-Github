name: Generate Cisco configurations

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible netaddr
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Generate configurations from NetBox
        working-directory: ansible
        env:
          NETBOX_API: ${{ secrets.NETBOX_API }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: ansible-playbook -i localhost, playbooks/generate_cpe_gin_config.yml

      - name: Upload generated configurations
        uses: actions/upload-artifact@v3
        with:
          name: generated-cisco-configs
          path: ansible/configs/generated/*.cfg
          if-no-files-found: warn
          retention-days: 7
